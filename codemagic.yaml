# ─────────────────────────────────────────────────────────────────────────────
# Codemagic CI/CD — My Digital Vanity iOS build
# ─────────────────────────────────────────────────────────────────────────────
#
# REQUIRED — Codemagic → your app → Environment variables
# Group "signing":
#   APP_STORE_CONNECT_KEY_IDENTIFIER   67K2T48W7Y
#   APP_STORE_CONNECT_ISSUER_ID        66d4ce13-148d-4d6b-bab8-f1d0d8441a1e
#   APP_STORE_CONNECT_PRIVATE_KEY      Full .p8 file contents (mark Secure)
#
# Group "build_env":
#   VITE_API_BASE_URL                  Your deployed API URL
#   VITE_REVENUECAT_IOS_API_KEY        RevenueCat iOS public API key (appl_…)

workflows:
  ios-app-store:
    name: iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mydigitalvanity.app
      xcode: latest
      node: 22
      groups:
        - signing
        - build_env
      vars:
        XCODE_SCHEME: App
        XCODE_PROJECT: artifacts/outfit-generator/ios/App/App.xcodeproj
        XCODE_WORKSPACE: artifacts/outfit-generator/ios/App/App.xcodeproj/project.xcworkspace
        COREPACK_ENABLE_STRICT: "0"
        BUNDLE_ID: com.mydigitalvanity.app
        TEAM_ID: 2A78MFVCJS
        PROFILE_NAME: My Digital Vanity AppStore

    scripts:
      - name: Install pnpm and dependencies
        script: |
          corepack disable || true
          npm install -g pnpm@9 --force
          pnpm install --no-frozen-lockfile

      - name: Build web assets
        script: |
          cd artifacts/outfit-generator
          VITE_API_BASE_URL=$VITE_API_BASE_URL \
          VITE_REVENUECAT_IOS_API_KEY=$VITE_REVENUECAT_IOS_API_KEY \
          pnpm vite build --config vite.capacitor.config.ts

      - name: Capacitor add iOS and sync
        script: |
          cd artifacts/outfit-generator
          rm -rf ios
          npx cap add ios
          # cap sync reads node_modules for packages with a "capacitor" field
          # in package.json and automatically adds them to the Podfile before
          # running pod install. background-removal-plugin (workspace:*) is
          # linked into node_modules by pnpm, so it is picked up automatically.
          npx cap sync ios

      - name: Set export compliance
        script: |
          PLIST="artifacts/outfit-generator/ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" || true
          # Ensure photo library key is present — Apple will reject without it
          /usr/libexec/PlistBuddy \
            -c "Delete :NSPhotoLibraryUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy \
            -c "Add :NSPhotoLibraryUsageDescription string 'Allow access to your photo library so you can add photos of your clothing items to your digital closet.'" \
            "$PLIST"
          # Ensure camera key is present — missing key causes a hard crash on camera access
          /usr/libexec/PlistBuddy \
            -c "Delete :NSCameraUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy \
            -c "Add :NSCameraUsageDescription string 'Allow camera access so you can take photos of your clothing items to add to your digital closet.'" \
            "$PLIST"
          # Required for Capacitor Camera to save captured photos back to the photo library
          /usr/libexec/PlistBuddy \
            -c "Delete :NSPhotoLibraryAddUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy \
            -c "Add :NSPhotoLibraryAddUsageDescription string 'My Digital Closet saves clothing photos to your photo library.'" \
            "$PLIST"

      - name: Inject app icon
        script: |
          cd artifacts/outfit-generator
          cp ../../app-store/AppIcon-1024.png resources/icon.png
          npx @capacitor/assets@latest generate --ios

      - name: Share App scheme
        script: |
          SCHEMES_DIR="$XCODE_PROJECT/xcshareddata/xcschemes"
          mkdir -p "$SCHEMES_DIR"
          # If Capacitor created a shared scheme already, leave it; otherwise copy from userdata
          if [ ! -f "$SCHEMES_DIR/App.xcscheme" ]; then
            USER_SCHEME=$(find "$XCODE_PROJECT/xcuserdata" -name "App.xcscheme" 2>/dev/null | head -1)
            if [ -n "$USER_SCHEME" ]; then
              cp "$USER_SCHEME" "$SCHEMES_DIR/App.xcscheme"
            fi
          fi
          echo "Shared schemes:"
          ls -la "$SCHEMES_DIR"
          echo "Available targets/schemes:"
          xcodebuild -list -project "$XCODE_PROJECT"

      - name: Set version and build number
        script: |
          cd artifacts/outfit-generator/ios/App
          # Floor at 125 — builds up to 124 already uploaded to App Store Connect
          BUILD_NUM=$(( BUILD_NUMBER > 124 ? BUILD_NUMBER : 125 ))
          agvtool new-marketing-version 1.0.1
          agvtool new-version -all $BUILD_NUM

      - name: Re-apply provisioning profiles after cap sync
        script: |
          xcode-project use-profiles \
            --project artifacts/outfit-generator/ios/App/App.xcodeproj

      - name: Resolve Swift Package dependencies
        script: |
          cd artifacts/outfit-generator/ios/App
          xcodebuild \
            -resolvePackageDependencies \
            -workspace App.xcodeproj/project.xcworkspace \
            -scheme App

      - name: Xcode archive
        script: |
          cd artifacts/outfit-generator/ios/App
          xcodebuild \
            -workspace App.xcodeproj/project.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=2A78MFVCJS \
            -archivePath "$CM_BUILD_DIR/build/App.xcarchive" \
            archive

      - name: Export IPA
        script: |
          # Write the .p8 key to disk so xcodebuild can authenticate with
          # Apple Developer Portal to resolve provisioning profiles automatically.
          mkdir -p "$HOME/private_keys"
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > "$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8"
          xcodebuild \
            -exportArchive \
            -archivePath "$CM_BUILD_DIR/build/App.xcarchive" \
            -exportOptionsPlist app-store/ExportOptions.plist \
            -exportPath "$CM_BUILD_DIR/build/ipa" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Upload to TestFlight
        script: |
          app-store-connect publish \
            --path "$CM_BUILD_DIR/build/ipa/App.ipa" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --private-key "@env:APP_STORE_CONNECT_PRIVATE_KEY" \
            --testflight

    artifacts:
      - $CM_BUILD_DIR/build/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
