# ─────────────────────────────────────────────────────────────────────────────
# Codemagic CI/CD — My Digital Vanity iOS build
# ─────────────────────────────────────────────────────────────────────────────
#
# REQUIRED — Codemagic → your app → Environment variables
# Group "signing":
#   APP_STORE_CONNECT_KEY_IDENTIFIER   67K2T48W7Y
#   APP_STORE_CONNECT_ISSUER_ID        66d4ce13-148d-4d6b-bab8-f1d0d8441a1e
#   APP_STORE_CONNECT_PRIVATE_KEY      Full .p8 file contents (mark Secure)
#
# Group "build_env":
#   VITE_API_BASE_URL                  Your deployed API URL
#   VITE_REVENUECAT_IOS_API_KEY        RevenueCat iOS public API key (appl_…)

workflows:
  ios-app-store:
    name: iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mydigitalvanity.app
      xcode: latest
      node: 22
      groups:
        - signing
        - build_env
      vars:
        XCODE_SCHEME: App
        XCODE_PROJECT: artifacts/outfit-generator/ios/App/App.xcodeproj
        XCODE_WORKSPACE: artifacts/outfit-generator/ios/App/App.xcodeproj/project.xcworkspace
        COREPACK_ENABLE_STRICT: "0"
        BUNDLE_ID: com.mydigitalvanity.app
        TEAM_ID: 2A78MFVCJS
        PROFILE_NAME: My Digital Vanity AppStore

    scripts:
      - name: Install pnpm and dependencies
        script: |
          corepack disable || true
          npm install -g pnpm@9 --force
          pnpm install --no-frozen-lockfile

      - name: Build web assets
        script: |
          cd artifacts/outfit-generator
          VITE_API_BASE_URL=$VITE_API_BASE_URL \
          VITE_REVENUECAT_IOS_API_KEY=$VITE_REVENUECAT_IOS_API_KEY \
          pnpm vite build --config vite.capacitor.config.ts

      - name: Capacitor add iOS and sync
        script: |
          cd artifacts/outfit-generator
          rm -rf ios
          npx cap add ios
          npx cap sync ios

      - name: Inject PhotoCleanup Vision plugin into Xcode project
        script: |
          NATIVE_SRC="artifacts/outfit-generator/native"
          IOS_APP="artifacts/outfit-generator/ios/App/App"

          # ── Step 1: copy the Swift implementation ────────────────────────────
          cp "$NATIVE_SRC/PhotoCleanupPlugin.swift" "$IOS_APP/"
          echo "Copied PhotoCleanupPlugin.swift"

          # ── Step 2: register plugin via AppDelegate.swift ────────────────────
          # CAPBridge.register() is the public Swift API for plugin registration.
          # This is more reliable than the ObjC CAP_PLUGIN macro, which requires
          # a separate .m file and ObjC +load — not available in pure-Swift targets.
          python3 - << 'PYEOF'
import re, sys

path = 'artifacts/outfit-generator/ios/App/App/AppDelegate.swift'
try:
    content = open(path).read()
except FileNotFoundError:
    print(f'ERROR: {path} not found', file=sys.stderr)
    sys.exit(1)

print('--- AppDelegate.swift (first 800 chars) ---')
print(content[:800])
print('---')

registration = '        CAPBridge.register(pluginClass: PhotoCleanupPlugin.self, withName: "PhotoCleanup")\n'

# Match the body of didFinishLaunchingWithOptions up to its "return true"
patched, n = re.subn(
    r'(func application\(_ application: UIApplication, didFinishLaunchingWithOptions'
    r'[^{]*\{[^}]*)return true',
    r'\g<1>' + registration + '        return true',
    content,
    count=1
)

if n == 0:
    print('WARNING: primary pattern did not match — trying simpler pattern')
    patched, n = re.subn(
        r'(// Override point for customization after application launch\.\n\s+)return true',
        r'\g<1>' + registration.lstrip() + '        return true',
        content,
        count=1
    )

if n == 0:
    print('ERROR: Could not find insertion point in AppDelegate.swift', file=sys.stderr)
    print('Full file:', file=sys.stderr)
    print(content, file=sys.stderr)
    sys.exit(1)

open(path, 'w').write(patched)
print('AppDelegate.swift patched — registration line added:')
for i, line in enumerate(patched.split('\n'), 1):
    if 'PhotoCleanup' in line or 'didFinishLaunch' in line:
        print(f'  L{i}: {line}')
print('Done ✓')
PYEOF

          # ── Step 3: add PhotoCleanupPlugin.swift to the Xcode project ────────
          ruby - << 'RUBY'
          require 'xcodeproj'

          def find_group_with_file(group, filename)
            return group if group.files.any? { |f| f.path == filename }
            group.groups.each do |g|
              result = find_group_with_file(g, filename)
              return result if result
            end
            nil
          end

          project = Xcodeproj::Project.open('artifacts/outfit-generator/ios/App/App.xcodeproj')
          target  = project.targets.find { |t| t.name == 'App' }
          raise "No 'App' target found" unless target

          app_group  = find_group_with_file(project.main_group, 'AppDelegate.swift')
          app_group ||= project.main_group.find_subpath('App', false)
          raise "Could not find App source group" unless app_group

          puts "Using group: #{app_group.path}"

          fname    = 'PhotoCleanupPlugin.swift'
          in_build = target.source_build_phase.files.any? { |bf| bf.file_ref&.path == fname }
          if in_build
            puts "  #{fname} already in build phase"
          else
            existing = app_group.files.find { |f| f.path == fname }
            ref = existing || app_group.new_reference(fname)
            target.source_build_phase.add_file_reference(ref)
            puts "  #{fname} added ✓"
          end

          project.save
          puts 'xcodeproj saved ✓'
          RUBY

      - name: Add export compliance and privacy keys to Info.plist
        script: |
          PLIST="artifacts/outfit-generator/ios/App/App/Info.plist"

          # Export compliance
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" 2>/dev/null; /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"

          # Camera usage — absence causes TCC SIGABRT crash on first camera access
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string placeholder" "$PLIST" 2>/dev/null; /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription Camera is used to photograph your beauty products." "$PLIST"

          # Photo library read
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string placeholder" "$PLIST" 2>/dev/null; /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription Photo library is used to choose photos of your beauty products." "$PLIST"

          # Photo library write
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string placeholder" "$PLIST" 2>/dev/null; /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryAddUsageDescription Photos you take are saved to your library." "$PLIST"

          echo "=== Verifying Info.plist privacy keys ==="
          /usr/libexec/PlistBuddy -c "Print :ITSAppUsesNonExemptEncryption" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSPhotoLibraryUsageDescription" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSPhotoLibraryAddUsageDescription" "$PLIST"
          echo "=== Done ==="

      - name: Inject app icon
        script: |
          ICONSET="artifacts/outfit-generator/ios/App/App/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICONSET"
          sips -z 1024 1024 app-store/AppIcon-1024.png --out "$ICONSET/AppIcon-1024.png"
          cat > "$ICONSET/Contents.json" << 'EOF'
          {
            "images": [
              {
                "filename": "AppIcon-1024.png",
                "idiom": "universal",
                "platform": "ios",
                "size": "1024x1024"
              }
            ],
            "info": {
              "author": "xcode",
              "version": 1
            }
          }
          EOF

      - name: Share App scheme
        script: |
          SCHEMES_DIR="$XCODE_PROJECT/xcshareddata/xcschemes"
          mkdir -p "$SCHEMES_DIR"
          # If Capacitor created a shared scheme already, leave it; otherwise copy from userdata
          if [ ! -f "$SCHEMES_DIR/App.xcscheme" ]; then
            USER_SCHEME=$(find "$XCODE_PROJECT/xcuserdata" -name "App.xcscheme" 2>/dev/null | head -1)
            if [ -n "$USER_SCHEME" ]; then
              cp "$USER_SCHEME" "$SCHEMES_DIR/App.xcscheme"
            fi
          fi
          echo "Shared schemes:"
          ls -la "$SCHEMES_DIR"
          echo "Available targets/schemes:"
          xcodebuild -list -project "$XCODE_PROJECT"

      - name: Set version and build number
        script: |
          cd artifacts/outfit-generator/ios/App
          agvtool new-marketing-version 1.0.1
          agvtool new-version -all $BUILD_NUMBER

      - name: Re-apply provisioning profiles after cap sync
        script: |
          xcode-project use-profiles \
            --project artifacts/outfit-generator/ios/App/App.xcodeproj

      - name: Resolve Swift Package dependencies
        script: |
          cd artifacts/outfit-generator/ios/App
          xcodebuild \
            -resolvePackageDependencies \
            -workspace App.xcodeproj/project.xcworkspace \
            -scheme App

      - name: Xcode archive
        script: |
          cd artifacts/outfit-generator/ios/App
          xcodebuild \
            -workspace App.xcodeproj/project.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=2A78MFVCJS \
            -archivePath "$CM_BUILD_DIR/build/App.xcarchive" \
            archive

      - name: Export IPA
        script: |
          xcodebuild \
            -exportArchive \
            -archivePath "$CM_BUILD_DIR/build/App.xcarchive" \
            -exportOptionsPlist app-store/ExportOptions.plist \
            -exportPath "$CM_BUILD_DIR/build/ipa"

      - name: Upload to TestFlight
        script: |
          # Use the .p8 key file Codemagic already placed on this machine
          # for the Developer Portal integration (same key, same ID)
          KEY_FILE=$(find /Users/builder -name "AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8" 2>/dev/null | head -1)
          if [ -z "$KEY_FILE" ]; then
            echo "Exact key not found, searching for any .p8..."
            KEY_FILE=$(find /Users/builder -name "AuthKey_*.p8" 2>/dev/null | head -1)
          fi
          if [ -z "$KEY_FILE" ]; then
            echo "ERROR: No .p8 key file found on machine"
            find /Users/builder -name "*.p8" 2>/dev/null || true
            exit 1
          fi
          echo "Using key file: $KEY_FILE"
          app-store-connect publish \
            --path "$CM_BUILD_DIR/build/ipa/App.ipa" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --private-key "@file:$KEY_FILE" \
            --testflight

    artifacts:
      - $CM_BUILD_DIR/build/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
